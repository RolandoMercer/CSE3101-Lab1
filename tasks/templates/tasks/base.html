<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Todo App{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 0 15px; }
    nav { background: #2c3e50; padding: 12px; margin-bottom: 20px; }
    nav a { color: white; margin-right: 15px; text-decoration: none; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    .done { text-decoration: line-through; color: gray; }
    .errorlist { color: #c0392b; list-style: none; padding: 0; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'tasks:task_list' %}">All Tasks</a>
    <a href="{% url 'tasks:task_create' %}">+ New Task</a>
  </nav>

  {% block content %}{% endblock %}
</body>
</html>
